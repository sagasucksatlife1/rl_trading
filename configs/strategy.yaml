# The shipped strategy: GBM cross-sectional score -> linear long-only weights, no-trade band,
# rebalanced every `strategy.every` days, under the hard risk overlay.
# Real data: python scripts/snapshot.py build --source sharadar --dir vendor/sharadar
#            then data.source=snapshot data.snapshot=<hash>
seed: 0

data:
  source: synthetic_pit      # snapshot | csv_pit | sharadar | synthetic_pit (test fixture)
  snapshot: null
  n_symbols: 30
  n_assets: 20
  n_days: 4000
  signal_ic: 0.05
  seed: 0

signal:                      # walk-forward LightGBM cross-sectional forecast
  enabled: true
  horizon: 21
  refit: 63
  min_train: 504
  embargo: 5

features:
  regime: true
  clip: 5.0

strategy:
  every: 5                   # rebalance every 5 trading days
  band: 0.02                 # no-trade band (fraction of NAV per name)
  top_frac: 0.5              # long the top half of names by score, weights ~ excess score

env:                         # backtest engine settings (same timing/cost model as the research)
  action_mode: long_only
  window: 1
  learned_band: false
  nav0: 10000000

costs:
  commission_bps: 1.0
  half_spread_bps: 2.0
  impact_coef: 0.7

risk:                        # hard overlay between the strategy and the broker
  enabled: true
  max_weight: 0.25
  max_gross: 1.0
  max_net: 1.0
  min_net: -1.0
  vol_target: 0.15
  max_turnover: 0.5
  dd_kill: 0.20
  cooldown: 21

split: {min_train: 756, val_len: 252, test_len: 252, purge: 21, embargo: 5}
