# Project 24 - RL for Trading. Every experiment is reproducible from this file + seed + data hash.
seed: 0

data:
  source: synthetic          # yfinance | csv | synthetic (regime_garch) | planted | noise
  tickers: null              # null = 50-name multi-asset DEFAULT_UNIVERSE (yfinance)
  start: "2007-01-01"
  end: null
  cache_dir: data_cache
  fallback_to_synthetic: true
  n_assets: 20               # synthetic only
  n_days: 4000               # synthetic only
  signal_ic: 0.05            # synthetic only: strength of the planted cross-sectional edge
  seed: 0

signal:                      # walk-forward GBM forecast (the alpha layer)
  enabled: true
  horizon: 21
  refit: 63
  min_train: 504
  embargo: 5

features:
  regime: true               # HMM P(turbulent), fitted on train rows only
  clip: 5.0

env:
  n_assets: null             # k assets per episode; null = full universe
  action_mode: long_only     # long_only | long_short
  temperature: 3.0
  max_gross: 1.0
  band: 0.0
  learned_band: true         # agent outputs its own no-trade band
  band_max: 0.05
  episode_len: 252
  random_start: true
  random_subset: false
  random_init_weights: true
  cost_mult_range: [0.5, 3.0]
  nav0: 10000000
  window: 5                  # stacked observation window (POMDP); the shared policy reads all frames

reward:
  kind: dsr                  # log | risk | dsr | cvar
  lam: 2.0
  risk: drawdown             # for kind=risk: variance | downside | drawdown
  eta: 0.0159                # DSR EMA rate (~1/63)
  scale: 100.0

costs:
  commission_bps: 1.0
  half_spread_bps: 2.0
  impact_coef: 0.7

risk:                        # hard overlay between policy and broker
  enabled: true
  in_training: false
  max_weight: 0.25
  max_gross: 1.0
  max_net: 1.0
  min_net: -1.0
  vol_target: 0.15
  max_turnover: 0.5
  dd_kill: 0.20
  cooldown: 21

split:
  mode: walk_forward         # walk_forward | single
  val_frac: 0.15
  test_frac: 0.2
  min_train: 756
  val_len: 252
  test_len: 252
  purge: 21
  embargo: 5
  rolling: null

agent:
  algo: ppo                  # ppo | recurrent_ppo | sac | td3
  seeds: [0, 1, 2, 3, 4]
  ensemble_top_k: 3
  total_steps: 600000
  eval_every: 20000
  patience: 8
  n_envs: 4
  subproc: false
  torch_threads: 1
  ppo: {shared_asset_policy: true, shared_hidden: 64}   # permutation-equivariant per-asset policy
  recurrent_ppo: {net_arch: [128], lstm_hidden_size: 128}
  sac: {net_arch: [256, 256]}
  td3: {net_arch: [256, 256]}

baselines:
  band: 0.02

tracking:
  dir: runs
  mlflow: false
  experiment: project24
